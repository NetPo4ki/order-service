{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-service.fullname" $ctx }}
  labels:
    {{- include "order-service.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "order-service.selectorLabels" $ctx | nindent 4 }}
  ports:
    {{- range $portName, $portNum := $svc.ports }}
    - name: {{ $portName }}
      port: {{ $portNum }}
      targetPort: {{ $portName }}
    {{- end }}
---
{{- end }}
