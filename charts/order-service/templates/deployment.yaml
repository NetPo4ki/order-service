{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-service.fullname" $ctx }}
  labels:
    {{- include "order-service.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "order-service.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "order-service.labels" $ctx | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ index $svc.ports $svc.adminPortName }}"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "order-service.fullname" $ctx }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag | default $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            {{- range $portName, $portNum := $svc.ports }}
            - name: {{ $portName }}
              containerPort: {{ $portNum }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "order-service.fullname" $ctx }}
            - secretRef:
                name: {{ $svc.existingSecretName | default (include "order-service.fullname" $ctx) }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.adminPortName }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $svc.adminPortName }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
{{- end }}
