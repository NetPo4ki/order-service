services:
  order-service:
    replicas: 3
    existingSecretName: order-service-db-credentials
    secretEnv: {}
    env:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      ADMIN_ADDR: ":9100"
      REDIS_ADDR: "order-service-redis.prod.svc.cluster.local:6379"
      RATE_LIMIT_REQUESTS: "50"
      RATE_LIMIT_WINDOW: "10s"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 65

postgres:
  enabled: false

redis:
  enabled: false

serviceMonitor:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: orders.example.com
