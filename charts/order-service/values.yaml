image:
  tag: ""
  pullPolicy: IfNotPresent

services:
  order-service:
    image:
      repository: ghcr.io/CHANGE_ME/order-service
      tag: ""
    replicas: 2
    ports:
      http: 8080
      grpc: 9090
      admin: 9100
    adminPortName: admin
    env:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      ADMIN_ADDR: ":9100"
      REDIS_ADDR: "order-service-redis:6379"
      RATE_LIMIT_REQUESTS: "20"
      RATE_LIMIT_WINDOW: "10s"
    existingSecretName: ""
    secretEnv:
      DATABASE_URL: "postgres://orders:orders@order-service-postgres:5432/orders?sslmode=disable"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      minAvailable: 1


postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 2Gi
  database: orders
  username: orders
  password: orders

redis:
  enabled: true
  image: redis:7-alpine
  storage: 1Gi

serviceMonitor:
  enabled: false

networkPolicy:
  enabled: false

ingress:
  enabled: false
  className: nginx
  host: order-service.local
