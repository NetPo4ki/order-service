syntax = "proto3";

package orderv1;

import "google/protobuf/timestamp.proto";

option go_package = "order-service/internal/delivery/grpc/orderv1;orderv1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
}

message CreateOrderRequest {
  int64 user_id = 1;
  int64 product_id = 2;
  int32 quantity = 3;
}

message GetOrderRequest {
  string id = 1;
}

message Order {
  string id = 1;
  int64 user_id = 2;
  int64 product_id = 3;
  int32 quantity = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 6;
}
